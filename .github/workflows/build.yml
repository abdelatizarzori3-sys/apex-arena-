name: Build Apex Arena Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: apex-arena-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK with Unity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Unity project
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2022.3.20f1
          targetPlatform: Android
          buildMethod: BuildPipeline.BuildAndroid
          androidExportType: androidPackage
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_NAME }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/Android/Apex-Arena.apk
          sha256sum build/Android/Apex-Arena.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Arena-Android-APK
          path: build/Android/Apex-Arena.apk
          if-no-files-found: error
          retention-days: 14
