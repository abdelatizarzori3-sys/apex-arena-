name: Build Apex Arena Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: apex-arena-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK with Unity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Unity project
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Validate Unity activation configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UNITY_LICENSE}" && ( -z "${UNITY_SERIAL}" || -z "${UNITY_EMAIL}" || -z "${UNITY_PASSWORD}" ) ]]; then
            echo "Missing Unity activation configuration. Add UNITY_LICENSE, or UNITY_EMAIL + UNITY_PASSWORD + UNITY_SERIAL to repository secrets."
            exit 1
          fi
          echo "Unity activation configuration detected without printing secret values."

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          unityVersion: 2022.3.20f1
          targetPlatform: Android
          buildMethod: BuildPipeline.BuildAndroid
          androidExportType: androidPackage

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          test -f build/Android/Apex-Arena-debug.apk
          sha256sum build/Android/Apex-Arena-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apex-Arena-Android-APK
          path: build/Android/Apex-Arena-debug.apk
          if-no-files-found: error
          retention-days: 14
